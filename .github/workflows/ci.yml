name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  # CI_RUNS_ON (an org variable) moves this to self-hosted runners; unset,
  # it stays on GitHub's.
  test:
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '"ubuntu-latest"') }}
    steps:
      - uses: actions/checkout@v4
      # A self-hosted runner uses its own Python 3; setup-python has no
      # builds for every Ubuntu.
      - uses: actions/setup-python@v5
        if: runner.environment == 'github-hosted'
        with:
          python-version: "3.12"
      - name: Install jsonschema
        run: |
          # --clear and an explicit idna: on the home runners a stray idna
          # without IDNAError broke jsonschema's import (#9).
          python3 -m venv --clear "$RUNNER_TEMP/venv"
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/venv/bin/pip" install jsonschema==4.23.0 idna==3.20
          "$RUNNER_TEMP/venv/bin/python" -c "import idna, jsonschema; print('idna from', idna.__file__)"
      - run: python3 -m unittest discover -s scripts -p 'test_*.py' -v
      - name: Published files match the schema
        run: |
          python3 - <<'PY'
          import json, pathlib, jsonschema
          schema = json.loads(pathlib.Path("schema/ratings-v1.schema.json").read_text())
          for p in [pathlib.Path("ratings/summary.json"), *pathlib.Path("snapshots").glob("*.json")]:
              if p.exists():
                  jsonschema.validate(json.loads(p.read_text()), schema)
                  print("ok", p)
          results = json.loads(pathlib.Path("quality/results.json").read_text())
          jsonschema.validate(results, json.loads(pathlib.Path("schema/quality-v1.schema.json").read_text()))
          for r in results["results"]:
              # Only complete rows are published, so every row can be compared.
              # A model that doesn't run is a result too: no scores, and why.
              if r.get("runs") == "no":
                  assert not r["scores"] and r.get("why"), f"{r['name']}: doesn't run, so needs a why and no scores"
                  continue
              # A speed test, as a phone runs today: how it ran and how fast, with no scores at all.
              if not r["scores"] and r.get("runs") and r.get("performance"):
                  continue
              missing = {"quality", "topics", "files", "reasoning"} - set(r["scores"])
              assert not missing, f"{r['name']}: no {sorted(missing)}"
              for suite, score in r["scores"].items():
                  assert suite in results["suites"], f"{r['name']}: no suite {suite}"
                  assert score["passed"] <= score["of"], f"{r['name']} {suite}: {score}"
          print("ok quality/results.json")
          listed = json.loads(pathlib.Path("quality/models.json").read_text())
          jsonschema.validate(listed, json.loads(pathlib.Path("schema/quality-models-v1.schema.json").read_text()))
          ids = [m["id"] for m in listed["models"]]
          assert len(ids) == len(set(ids)), "a model is listed twice"
          print("ok quality/models.json")
          PY
